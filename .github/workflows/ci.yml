name: macOS Swift CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Wailo
        working-directory: app
        run: swift build
      - name: Test Wailo
        working-directory: app
        run: swift test
